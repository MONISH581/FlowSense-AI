version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowsense-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/flowsense.db
      - JWT_SECRET_KEY=flowsense_production_secret_key_8f7b2a9e4c1
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowsense-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:

